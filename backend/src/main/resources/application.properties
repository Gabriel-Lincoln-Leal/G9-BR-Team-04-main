spring.application.name=techmind
server.address=${SERVER_ADDRESS:127.0.0.1}

# URL atualizada com a sua PDB local
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect.oracle.prefer_long_raw=true

# Logging: reduzir verbosidade
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF

# Upload de arquivos (endpoint /conteudo/lote) - deve bater com o limite do ValidatorCsv
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
spring.datasource.hikari.maximum-pool-size=4

# Actuator e Observabilidade (incluindo endpoints de resiliencia)
management.endpoints.web.exposure.include=health,info
springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:false}
management.health.circuitbreakers.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:0.0}

logging.file.name=logs/techmind.log
techmind.api-key=${TECHMIND_API_KEY}
techmind.classificador.base-url=${CLASSIFIER_BASE_URL:http://127.0.0.1:8000}

# Virtual Threads
spring.threads.virtual.enabled=true

# ===== Resilience4j - Circuit Breaker =====
resilience4j.circuitbreaker.instances.classificador.sliding-window-size=10
resilience4j.circuitbreaker.instances.classificador.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.classificador.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.classificador.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.classificador.record-exceptions=com.g9team04.techmind.infrastructure.MlClassificacaoException

# ===== Resilience4j - Retry =====
resilience4j.retry.instances.classificador.max-attempts=3
resilience4j.retry.instances.classificador.wait-duration=500ms
resilience4j.retry.instances.classificador.retry-exceptions=org.springframework.web.client.ResourceAccessException

# ===== Resilience4j - Bulkhead =====
resilience4j.bulkhead.instances.classificador.max-concurrent-calls=4
resilience4j.bulkhead.instances.classificador.max-wait-duration=0
